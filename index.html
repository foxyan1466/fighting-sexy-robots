        // Список треков и официальных стриминг-превью аудиофайлов
        const playlist = [
            {
                title: "Я вчера тебя кхм...",
                url: "https://apple.com"
            },
            {
                title: "Я умер, ты (не) обиделась",
                url: "https://apple.com"
            }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('play-pause-btn');
        const trackTitle = document.getElementById('display-track');
        const progressBar = document.getElementById('progress-bar');

        // Инициализация первого трека
        function initPlayer() {
            audio.src = playlist[currentTrackIndex].url;
            trackTitle.innerText = "▶ " + playlist[currentTrackIndex].title;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "PAUSE";
            } else {
                audio.pause();
                playBtn.innerText = "PLAY";
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            audio.src = playlist[currentTrackIndex].url;
            trackTitle.innerText = "▶ " + playlist[currentTrackIndex].title;
            audio.play();
            playBtn.innerText = "PAUSE";
        }

        // Обновление полосы прогресса
        audio.addEventListener('timeupdate', () => {
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percentage + "%";
        });

        // Когда трек закончился - включаем следующий
        audio.addEventListener('ended', () => {
            nextTrack();
        });

        // Логика кнопки входа
        function activateSystem() {
            const intro = document.getElementById('intro-screen');
            const main = document.getElementById('main-content');
            
            intro.style.opacity = '0';
            initPlayer(); // Подгружаем плеер при входе
            
            setTimeout(() => {
                intro.style.display = 'none';
                main.style.display = 'block';
                setTimeout(() => {
                    main.style.opacity = '1';
                }, 50);
            }, 500);
        }
